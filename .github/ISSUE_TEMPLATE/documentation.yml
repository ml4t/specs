name: Documentation problem
description: Report missing, incorrect, or difficult documentation
title: "[Docs]: "
labels:
  - "type: documentation"
  - "priority: normal"
  - "status: needs-triage"
  - "compatibility: none"
body:
  - type: markdown
    attributes:
      value: |
        Read the [contribution guide](https://github.com/ml4t/specs/blob/main/CONTRIBUTING.md)
        and [shared policy](https://github.com/ml4t/ecosystem/blob/main/CONTRIBUTING.md).
        Search existing issues first. Describe one documentation problem or coherent change.
  - type: dropdown
    id: library
    attributes:
      label: Affected library
      options:
        - data
        - engineer
        - backtest
        - specs
        - live
        - diagnostic
        - models
        - ecosystem
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package or documentation version
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page or API location
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: State what is missing, incorrect, or difficult to follow.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Required documentation outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: ai_assistance
    attributes:
      label: AI assistance
      description: State whether AI tools helped prepare this report and which parts. Write "None" if unused.
    validations:
      required: true
  - type: checkboxes
    id: accountability
    attributes:
      label: Contributor accountability
      options:
        - label: I reviewed this report and can explain its reproduction, requested behavior, or evidence.
          required: true
