name: Feature request
description: Request a concrete new or expanded capability
title: "[Feature]: "
labels:
  - "type: feature"
  - "priority: normal"
  - "status: needs-triage"
  - "compatibility: affected"
body:
  - type: markdown
    attributes:
      value: |
        Read the [contribution guide](https://github.com/ml4t/specs/blob/main/CONTRIBUTING.md)
        and [shared policy](https://github.com/ml4t/ecosystem/blob/main/CONTRIBUTING.md).
        Search existing issues first. Request one coherent change and discuss intended behavior
        before opening a PR. Identify contract versioning, serialized fixtures, migration guidance,
        and affected producer/consumer libraries when compatibility changes.
  - type: dropdown
    id: library
    attributes:
      label: Owning library
      options:
        - data
        - engineer
        - backtest
        - specs
        - live
        - diagnostic
        - models
        - ecosystem
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Current package version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the workflow that cannot be completed or is unnecessarily difficult.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Required outcome
      description: State observable behavior without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing alternatives
      description: Describe workarounds or related APIs already considered.
  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility impact
      options:
        - Existing API extension
        - New cross-library contract
        - Potentially incompatible behavior
        - No known compatibility impact
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: ai_assistance
    attributes:
      label: AI assistance
      description: State whether AI tools helped prepare this report and which parts. Write "None" if unused.
    validations:
      required: true
  - type: checkboxes
    id: accountability
    attributes:
      label: Contributor accountability
      options:
        - label: I reviewed this report and can explain its reproduction, requested behavior, or evidence.
          required: true
