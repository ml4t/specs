name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.9"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --python ${{ env.PYTHON_VERSION }} --dev

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.9"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --python ${{ env.PYTHON_VERSION }} --dev

      - name: Run ty check
        run: uv run ty check

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.9"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Export locked environments
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes \
            --output-file "${{ runner.temp }}/core.txt"
          uv export --locked --all-groups --no-emit-project --no-hashes \
            --output-file "${{ runner.temp }}/complete.txt"

      - name: Audit locked environments
        run: |
          uv run pip-audit --requirement "${{ runner.temp }}/core.txt"
          uv run pip-audit --requirement "${{ runner.temp }}/complete.txt"

  qualify:
    name: Qualify (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.9"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: uv sync --python python --dev

      - name: Import package
        run: uv run --python python python -c "import ml4t.specs"

      - name: Run tests
        run: uv run --python python pytest tests/ -q

      - name: Run ty check
        run: >-
          uv run --python python
          ty check --python-version ${{ matrix.python-version }}

      - name: Build package
        run: uv build --python python

      - name: Install built wheel
        shell: bash
        run: |
          uv venv --python python .artifact-venv
          wheel="$(find dist -name '*.whl' -print -quit)"
          uv pip install --python .artifact-venv "$wheel"

      - name: Import built wheel
        run: uv run --python .artifact-venv --no-project python -c "import ml4t.specs"

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, qualify]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.9"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: uv build

      - name: Validate package metadata
        run: uv run twine check dist/*

      - name: Validate typed-package marker
        run: >-
          uv run python -c
          "import glob, zipfile; wheel=glob.glob('dist/*.whl')[0];
          names=zipfile.ZipFile(wheel).namelist();
          assert 'ml4t/specs/py.typed' in names, names"

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          uv run python -c
          "import os; from ml4t.specs import __version__;
          tag=os.environ['GITHUB_REF_NAME'];
          assert tag == f'v{__version__}', f'{tag} does not match v{__version__}'"

      - name: Validate wheel installation
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .artifact-venv
          uv pip install --python .artifact-venv dist/*.whl
          uv run --python .artifact-venv --no-project python -c "import ml4t.specs"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
