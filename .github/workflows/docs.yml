name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build revision-identified documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.9"
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --python ${{ env.PYTHON_VERSION }} --dev --extra docs
      - name: Record source identity
        shell: bash
        run: |
          echo "ML4T_DOCS_VERSION=$(uv run python -c 'from ml4t.specs import __version__; print(__version__)')" >> "$GITHUB_ENV"
          echo "ML4T_DOCS_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Execute the README quick start
        run: uv run python scripts/run_readme_quickstart.py
      - name: Check every README link
        run: uv run python scripts/check_readme_links.py README.md
      - name: Build and verify documentation
        run: |
          uv run mkdocs build --strict
          uv run python scripts/verify_documentation_identity.py \
            --site site \
            --expected-library specs \
            --expected-version "$ML4T_DOCS_VERSION" \
            --expected-commit "$ML4T_DOCS_COMMIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-${{ github.sha }}
          path: site/
          if-no-files-found: error
          retention-days: 14
